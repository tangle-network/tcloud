name: SDK frozen workspace install
on:
  pull_request:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Frozen install of all workspace importers
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml
      - name: Build, test and pack the published SDK
        run: |
          pnpm --filter '@tangle-network/tcloud...' run build
          pnpm --filter @tangle-network/tcloud test
          pnpm --dir packages/tcloud pack --pack-destination "$RUNNER_TEMP"

name: SDK frozen workspace install
on:
  pull_request:
  push:
    branches: [pro/tangle-agent-v1-video-routes]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Frozen install of all workspace importers
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD > verification/REVISION
          git ls-files 'packages/*/package.json' | tee verification/workspaces.txt
          pnpm install --frozen-lockfile 2>&1 | tee verification/install.log
          git diff --exit-code -- pnpm-lock.yaml
      - name: Build and test the actual published SDK
        run: |
          set -euo pipefail
          pnpm --filter '@tangle-network/tcloud...' run build 2>&1 | tee verification/build.log
          pnpm --filter @tangle-network/tcloud test 2>&1 | tee verification/tests.log
          pnpm --dir packages/tcloud pack --pack-destination ../../verification
      - name: Retain exact checked source
        if: always()
        run: |
          mkdir -p verification
          git archive --format=tar HEAD > verification/source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sdk-frozen-${{ github.sha }}
          path: verification/
          retention-days: 3

name: Tangle agent media SDK verification
on:
  push:
    branches: [pro/tangle-agent-v1-video-routes]
    paths: [.github/workflows/tangle-agent-v1-media.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pro/tangle-agent-v1-video-routes
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: '10.28.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Commit the existing SDK correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/tcloud/src/client.ts'); s=p.read_text()
          for old,new in [('`${this.baseURL}/video/generate`','`${this.baseURL}/videos`'),('`${this.baseURL}/video/${encodeURIComponent(id)}`','`${this.baseURL}/videos/${encodeURIComponent(id)}`')]:
            assert s.count(old)==1, old
            s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          git add packages/tcloud/src/client.ts
          git rm .github/workflows/tangle-agent-v1-media.yml
          git -c user.name=tangletools -c user.email=hello@tangle.tools commit -m 'fix: use canonical Router video create and status endpoints'
          git push origin HEAD:pro/tangle-agent-v1-video-routes
          mkdir -p /tmp/tcloud-v1
          git rev-parse HEAD > /tmp/tcloud-v1/REVISION
      - name: Install and build the real SDK
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/tcloud-v1/install.log
          pnpm --filter '@tangle-network/tcloud...' run build 2>&1 | tee /tmp/tcloud-v1/build.log
          pnpm --filter @tangle-network/tcloud pack --pack-destination /tmp/tcloud-v1
      - name: Retain exact source
        if: always()
        run: |
          mkdir -p /tmp/tcloud-v1
          git archive --format=tar HEAD > /tmp/tcloud-v1/source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tcloud-v1-sdk-check
          path: /tmp/tcloud-v1/
          retention-days: 3

name: Release @tangle-network/tcloud-agent

# Same release contract as release.yml, for the agent package. npm trusted
# publishing is configured per package and per workflow file, so the npm
# package settings for @tangle-network/tcloud-agent must list this repository
# and `release-agent.yml` before a tag can publish.

on:
  push:
    tags:
      - '@tangle-network/tcloud-agent@*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing @tangle-network/tcloud-agent release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-tcloud-agent
  cancel-in-progress: false

jobs:
  prepare:
    uses: tangle-network/tcloud/.github/workflows/prepare-release.yml@main
    permissions:
      contents: read
    with:
      package: tcloud-agent
      release_tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Download the inspected release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tcloud-agent-${{ needs.prepare.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-release
      - name: Install release npm
        run: npm install --global npm@12.1.0 --registry=https://registry.npmjs.org
      # Trusted publication is the only job requiring a GitHub-hosted runner.
      - name: Publish and verify the exact qualified npm artifact
        env:
          TARBALL_PATH: ${{ runner.temp }}/qualified-release/${{ needs.prepare.outputs.filename }}
          EXPECTED_NAME: ${{ needs.prepare.outputs.name }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_SHA1: ${{ needs.prepare.outputs.sha1 }}
          ALLOW_PUBLISH: 'true'
        run: node "$RUNNER_TEMP/qualified-release/npm-release.mjs"

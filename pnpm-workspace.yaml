packages:
  - 'packages/*'
# First-party packages are cut and consumed inside this fleet, so a release-age
# hold on them would freeze this workspace behind its own cohort.
minimumReleaseAgeExclude:
  - '@tangle-network/*'
# esbuild's postinstall verifies its platform binary. The Pi dev toolchain's
# @google/genai preinstall is an echo, and protobufjs only checks its optional CLI.
allowBuilds:
  esbuild: true
  '@google/genai': false
  protobufjs: false
